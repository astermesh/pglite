name: test release tooling

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      - astermesh/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"
  push:
    branches:
      - astermesh/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"

jobs:
  test:
    name: Test publication contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@astermesh"
      - name: Check release scripts
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done
      - name: Check GitHub Packages version query
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output="$(npm view '@astermesh/pglite@>=0.0.0' version --json --registry=https://npm.pkg.github.com)"
          node --input-type=module --eval '
            import { parsePublishedVersions } from "./.github/scripts/classify-packages.mjs"
            parsePublishedVersions(process.argv[1], "@astermesh/pglite")
          ' "$output"
      - name: Test release scripts
        run: node --test .github/scripts/release-tools.test.mjs
