name: test release tooling

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      # Both names are listed for the length of the rename. This workflow is the
      # branch's only required check, and a filter naming just the new ref would
      # keep it from running on the pull request that migrates the tooling.
      - astermesh/ci
      - simbox/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"
  push:
    branches:
      - astermesh/ci
      - simbox/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"

jobs:
  test:
    name: Test publication contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"
      - name: Check release scripts
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done
      - name: Check GitHub Packages version query
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This probe reads a live registry record, so it names the identity the
          # family is published under today. It moves to the renamed scope once
          # that scope carries a published release.
          PUBLISHED_PACKAGE: "@astermesh/pglite"
        run: |
          output="$(npm view "$PUBLISHED_PACKAGE@>=0.0.0" version --json --registry=https://npm.pkg.github.com)"
          node --input-type=module --eval '
            import { parsePublishedVersions } from "./.github/scripts/classify-packages.mjs"
            parsePublishedVersions(process.argv[1], process.argv[2])
          ' "$output" "$PUBLISHED_PACKAGE"
      - name: Test release scripts
        run: node --test .github/scripts/release-tools.test.mjs
