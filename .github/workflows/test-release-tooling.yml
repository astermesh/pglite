name: test release tooling

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      # Both names are listed for the length of the rename. This workflow is the
      # branch's only required check, and a filter naming just the new ref would
      # keep it from running on the pull request that migrates the tooling.
      - astermesh/ci
      - simbox/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"
  push:
    branches:
      - astermesh/ci
      - simbox/ci
    paths:
      - ".github/attestations/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/test-release-tooling.yml"

jobs:
  test:
    name: Test publication contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"
      - name: Check release scripts
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done
      - name: Check GitHub Packages version query
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The probe makes the same live query a release run makes, so it names
          # the identity this repository owns and publishes rather than a scope
          # written down here. On GitHub Packages the scope is the owner, and the
          # run token can only read what its own owner holds.
          PUBLISHED_PACKAGE: "@${{ github.repository_owner }}/pglite"
        run: |
          set +e
          output="$(npm view "$PUBLISHED_PACKAGE@>=0.0.0" version --json \
            --registry=https://npm.pkg.github.com 2> "$RUNNER_TEMP/npm-view.err")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # A missing record is an answer, not a failure: classify-packages.mjs
            # reads E404 as "nothing published yet" and releases the first version
            # of a family on it. The probe holds itself to the same contract, so it
            # keeps working before the family's first release under this name and
            # starts exercising the parse path by itself once one exists.
            if grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              echo "$PUBLISHED_PACKAGE has no published record yet; registry answered 404"
              exit 0
            fi
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi
          node --input-type=module --eval '
            import { parsePublishedVersions } from "./.github/scripts/classify-packages.mjs"
            parsePublishedVersions(process.argv[1], process.argv[2])
          ' "$output" "$PUBLISHED_PACKAGE"
      - name: Test release scripts
        run: node --test .github/scripts/release-tools.test.mjs
