name: Build and test PGlite packages

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Build PGLite packages'
  push:
    branches: ['main']
  pull_request:

jobs:
  stylecheck:
    name: Stylecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stylecheck packages
        run: pnpm -r stylecheck

  build-all:
    name: Install, build all and test as described in README
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      BUILD_CONFIG_FILE: postgres-pglite/.buildconfig
      TZ: UTC

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: ${{ github.workspace }}
        run: pnpm install

      - name: Build all
        working-directory: ${{ github.workspace }}
        env:
          PGSRC: ${{ github.workspace }}/postgres-pglite
        run: |
          pnpm build:all

      - name: Typecheck pglite
        working-directory: ${{ github.workspace }}/packages/pglite
        run: pnpm typecheck
      - name: Test pglite
        working-directory: ${{ github.workspace }}/packages/pglite
        run: pnpm test

      - name: Upload PGlite Interim to Github artifacts
        id: upload-pglite-interim-build-files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-interim-build-files-node-v20.x
          path: ./packages/pglite/release/**
          retention-days: 60

      - name: Upload pglite-tools build artifacts to Github artifacts
        id: upload-pglite-tools-release-files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-tools-release-files-node-v20.x
          path: ./packages/pglite-tools/release/**
          retention-days: 60

      # A release line's merge is the point of no return: it starts the publication.
      # Reach the publication's own verdict here instead, on the merge result.
      - name: Checkout release tooling
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.base_ref, 'simbox/v')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: simthis/pglite
          ref: simbox/ci
          sparse-checkout: .github
          path: .release-toolset

      - name: Verify package family against the registry
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.base_ref, 'simbox/v')
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKED_PACKAGES: ${{ runner.temp }}/candidate/packed-packages.json
          PUBLISH_PACKAGES: ${{ runner.temp }}/candidate/publish-packages.json
          PUBLISH_MODE: 'false'
          RELEASE_CONTEXT: ${{ runner.temp }}/candidate/release-context.json
          RELEASE_LINE: ${{ github.base_ref }}
          SOURCE_OVERRIDE: 'true'
          TARBALL_DIRECTORY: ${{ runner.temp }}/candidate
        run: |
          mkdir -p "$TARBALL_DIRECTORY"
          node .release-toolset/.github/scripts/resolve-release.mjs
          node .release-toolset/.github/scripts/pack-packages.mjs
          node .release-toolset/.github/scripts/classify-packages.mjs

  build-and-test-pglite:
    name: Build and Test packages/pglite
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 21.x, 22.x, 23.x, 24.x]
    defaults:
      run:
        working-directory: ./packages/pglite
    needs: [build-all]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # A 503 from the release host has reddened this gate on an unchanged head:
      # the toolchain is re-resolved and re-downloaded in every matrix entry, and
      # two retries 16s apart are not enough to ride out a bad minute.
      - name: Install Deno
        env:
          DENO_VERSION: v2.9.5
        run: |
          curl --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --output "${RUNNER_TEMP}/deno.zip" \
            "https://github.com/denoland/deno/releases/download/${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          mkdir -p "${HOME}/.deno/bin"
          unzip -q -o "${RUNNER_TEMP}/deno.zip" -d "${HOME}/.deno/bin"
          chmod +x "${HOME}/.deno/bin/deno"
          echo "${HOME}/.deno/bin" >> "${GITHUB_PATH}"

      - name: Download PGlite WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-interim-build-files-node-v20.x
          path: ./packages/pglite/release

      - name: Download pglite-tools WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-tools-release-files-node-v20.x
          path: ./packages/pglite-tools/release

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps

      - name: Build dependencies
        run: pnpm --filter "@simthis/pglite^..." build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test web integrations
        # retry on failure as web tests can be flaky
        run: pnpm test:web || pnpm test:web || pnpm test:web

      - name: Test Deno
        run: pnpm test:deno

      - name: Pack for distribution
        run: pnpm pack

      - name: Upload PGlite distribution artifact
        id: upload-pglite-dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-dist-node-v${{ matrix.node }}
          path: ./packages/pglite/dist/*

      - name: Upload PGlite package artifact
        id: upload-pglite-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-package-node-v${{ matrix.node }}
          path: ./packages/pglite/simthis-pglite-*.tgz
          retention-days: 60

      - name: Find Comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: fc
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '- PGlite:'

      - name: Create or update build outputs comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            - PGlite: ${{ steps.upload-pglite-package.outputs.artifact-url }}
          edit-mode: append

  build-and-test-pglite-dependents:
    name: Build and Test packages dependent on PGlite
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 21.x, 22.x, 23.x, 24.x]
    needs: [build-and-test-pglite]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Download PGlite build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-dist-node-v${{ matrix.node }}
          path: ./packages/pglite/dist/

      - name: Download pglite-tools WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-tools-release-files-node-v20.x
          path: ./packages/pglite-tools/release/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pg-protocol
        run: pnpm --filter "@simthis/pg-protocol" build

      - name: Build packages
        run: pnpm --filter="...^@simthis/pglite" build

      - name: Typecheck packages
        run: pnpm --filter="...^@simthis/pglite" typecheck

      - name: Test packages
        run: pnpm --filter="...^@simthis/pglite" test

      - name: Upload pglite-tools distribution artifact
        id: upload-pglite-tools-dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-tools-dist-node-v${{ matrix.node }}
          path: ./packages/pglite-tools/dist/*

  publish-website-with-demos:
    name: Publish website with demos
    runs-on: ubuntu-22.04
    needs: [build-and-test-pglite, build-and-test-pglite-dependents]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download PGlite WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-interim-build-files-node-v20.x
          path: ./packages/pglite/release

      - name: Download pglite-tools WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-tools-release-files-node-v20.x
          path: ./packages/pglite-tools/release

      - name: Download PGlite build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-dist-node-v20.x
          path: ./packages/pglite/dist/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build REPL and benchmark packages needed for examples
        run: pnpm --filter "@simthis/pglite-react" --filter "@simthis/pglite-repl" --filter "benchmark"  build

      - name: Download PGlite web build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-interim-build-files-node-v20.x
          path: /tmp/web

      - name: Download pglite-tools dist artifacts to tmp
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-tools-dist-node-v20.x
          path: /tmp/pglite-tools

      - name: Build demo site
        env:
          PGSRC: ${{ github.workspace }}/postgres-pglite
          POSTGRES_PGLITE_OUT: ${{ github.workspace }}/packages/pglite/release
          PGLITE: ${{ github.workspace }}/packages/pglite
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/web/examples/ /tmp/web/dist /tmp/web/benchmark
          cp -r ${PGLITE}/dist/* /tmp/web/dist/
          cp -r ${PGLITE}/examples/* /tmp/web/examples/
          cp -r ${{ github.workspace }}/packages/benchmark/dist/* /tmp/web/benchmark/
          rm -rf /tmp/web/examples/pglite-tools
          cp -r /tmp/pglite-tools /tmp/web/examples/

      - name: Build docs
        working-directory: ./docs
        run: |
          pnpm run docs:build
          cp -r ./.vitepress/dist/* /tmp/web/

      - name: Upload Demos to Github artifacts
        id: upload-demos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pglite-demos
          path: /tmp/web/**
          retention-days: 60

      - name: Find Comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: fc
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Built bundles

      - name: Create or update build outputs comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            - Demos: ${{ steps.upload-demos.outputs.artifact-url }}
          edit-mode: append

      - name: Deploy website to Netlify
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0
        with:
          publish-dir: '/tmp/web'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy PR${{ github.event.pull_request.id }}: ${{ github.event.pull_request.title }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  changesets-release:
    if: github.event_name == 'push'
    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: write # to create release (changesets/action)
      issues: write # to post issue comments (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
    name: Make a PR or publish
    runs-on: ubuntu-22.04
    needs: [build-all]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # Required for npm trusted publishing (npm 11.5.1+)
          cache: pnpm

      - name: Download PGlite WASM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-interim-build-files-node-v20.x
          path: ./packages/pglite/release

      - name: Download pglite-tools build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pglite-tools-release-files-node-v20.x
          path: ./packages/pglite-tools/release/

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          title: 'chore: publish new package versions'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
