name: build
run-name: publish ${{ inputs.ref }} as ${{ inputs.version }}

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'line branch to build (e.g. astermesh/v0.3)'
        required: true
        default: 'astermesh/v0.3'
      version:
        description: 'package version to publish'
        required: true
        default: '0.3.17'

jobs:
  build:
    name: Build engine + package
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG_FILE: postgres-pglite/.buildconfig
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@astermesh'
      - name: Validate release request
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_REF" == 'astermesh/v0.3' ]]
          [[ "$RELEASE_VERSION" =~ ^0\.3\.[0-9]+$ ]]
      - name: Install
        run: pnpm install
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd packages/pglite
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          npm pkg set repository.url='https://github.com/astermesh/pglite.git'
      - name: Build engine
        env:
          PGSRC: ${{ github.workspace }}/postgres-pglite
        run: pnpm wasm:build
      - name: Build package
        run: pnpm --filter "./packages/pglite..." build
      - name: Write provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          BUILDER_IMAGE='electricsql/pglite-builder:3.1.74_4'
          BUILDER_DIGEST="$(docker image inspect "$BUILDER_IMAGE" --format '{{index .RepoDigests 0}}')"
          SDK_VERSION="$(sed -n 's/^SDK_VERSION=//p' postgres-pglite/.buildconfig)"
          [[ -n "$BUILDER_DIGEST" ]]
          [[ -n "$SDK_VERSION" ]]
          WRAPPER_COMMIT="$(git rev-parse HEAD)"
          ENGINE_COMMIT="$(git -C postgres-pglite rev-parse HEAD)"
          cat > packages/pglite/PROVENANCE.md <<EOF
          # Build provenance

          - Package: \`@astermesh/pglite@$RELEASE_VERSION\`
          - Upstream package: \`@electric-sql/pglite@0.3.16\`
          - Upstream wrapper release: \`4555814e2b0beac8af5d5d760907040b7b8f61df\`
          - Wrapper line commit: \`$WRAPPER_COMMIT\`
          - Upstream engine pin: \`51e222cc5f799675b8dd098f5cb7bf46cbad75a2\`
          - Engine line commit: \`$ENGINE_COMMIT\`
          - Engine patch: \`2b87c7880b6e4a9af56d582b4d94d10000437aac\`
          - PostgreSQL: \`17.5\`
          - Emscripten SDK: \`$SDK_VERSION\`
          - Builder: \`$BUILDER_DIGEST\`
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
      - name: Verify publish payload
        working-directory: packages/pglite
        env:
          PACK_REPORT: ${{ runner.temp }}/pglite-pack.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm pack --dry-run --json > "$PACK_REPORT"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const [pack] = JSON.parse(readFileSync(process.env.PACK_REPORT, 'utf8'))
          const expectedVersion = process.env.RELEASE_VERSION
          const paths = new Set(pack.files.map((file) => file.path))
          if (pack.name !== '@astermesh/pglite') {
            throw new Error('unexpected package name: ' + pack.name)
          }
          if (pack.version !== expectedVersion) {
            throw new Error('unexpected package version: ' + pack.version)
          }
          if (!paths.has('PROVENANCE.md')) {
            throw new Error('PROVENANCE.md is missing from the package')
          }

          const provenance = readFileSync('PROVENANCE.md', 'utf8')
          const required = [
            ['upstream package', /- Upstream package: `@electric-sql\/pglite@0\.3\.16`/],
            ['upstream wrapper release', /- Upstream wrapper release: `[0-9a-f]{40}`/],
            ['wrapper line commit', /- Wrapper line commit: `[0-9a-f]{40}`/],
            ['upstream engine pin', /- Upstream engine pin: `[0-9a-f]{40}`/],
            ['engine line commit', /- Engine line commit: `[0-9a-f]{40}`/],
            ['Emscripten SDK', /- Emscripten SDK: `[^`]+`/],
            ['builder digest', /- Builder: `[^`]+@sha256:[0-9a-f]{64}`/],
            ['workflow run', /- Workflow run: https:\/\/github\.com\/astermesh\/pglite\/actions\/runs\/[0-9]+/],
          ]
          for (const [field, pattern] of required) {
            if (!pattern.test(provenance)) {
              throw new Error('missing or invalid provenance field: ' + field)
            }
          }
          NODE
      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pglite-release
          path: packages/pglite/release/**
          retention-days: 60
      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: pglite-dist
          path: packages/pglite/dist/**
          retention-days: 60
      - name: Publish package
        working-directory: packages/pglite
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
