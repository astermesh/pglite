name: build and publish
run-name: publish ${{ inputs.line || inputs.ref }} from ${{ inputs.ref }}

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'line branch to publish (astermesh/vX.Y)'
        required: true
        type: string
      version:
        description: 'immutable package version to publish'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'exact line commit to publish'
        required: true
        type: string
      line:
        description: 'line branch containing the commit'
        required: true
        type: string
      version:
        description: 'version override; defaults to packages/pglite/package.json'
        required: false
        default: ''
        type: string

concurrency:
  group: pglite-publish-${{ inputs.line || inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_CONFIG_FILE: postgres-pglite/.buildconfig
      FORK_LINEAGE_PREDICATE_TYPE: https://github.com/astermesh/pglite/attestations/fork-lineage/v1
      FORK_LINEAGE_SCHEMA: ${{ github.workspace }}/.astermesh-ci/.github/attestations/fork-lineage-v1.schema.json
      RELEASE_LINE: ${{ inputs.line || inputs.ref }}
      REQUESTED_VERSION: ${{ inputs.version }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Checkout attestation contract
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/attestations
          path: .astermesh-ci
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@astermesh'
      - name: Resolve and validate release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_LINE" =~ ^astermesh/v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::invalid release line: $RELEASE_LINE"
            exit 1
          fi
          LINE_MAJOR="${BASH_REMATCH[1]}"
          LINE_MINOR="${BASH_REMATCH[2]}"

          PACKAGE_NAME="$(node -p "require('./packages/pglite/package.json').name")"
          SOURCE_VERSION="$(node -p "require('./packages/pglite/package.json').version")"
          RELEASE_VERSION="${REQUESTED_VERSION:-$SOURCE_VERSION}"

          if [[ "$PACKAGE_NAME" != '@astermesh/pglite' ]]; then
            echo "::error::unexpected package name: $PACKAGE_NAME"
            exit 1
          fi
          if [[ ! "$SOURCE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::invalid source version: $SOURCE_VERSION"
            exit 1
          fi
          SOURCE_PATCH="${BASH_REMATCH[3]}"
          if [[ "${BASH_REMATCH[1]}" != "$LINE_MAJOR" || "${BASH_REMATCH[2]}" != "$LINE_MINOR" ]]; then
            echo "::error::source version $SOURCE_VERSION does not belong to $RELEASE_LINE"
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          RELEASE_PATCH="${BASH_REMATCH[3]}"
          if [[ "${BASH_REMATCH[1]}" != "$LINE_MAJOR" || "${BASH_REMATCH[2]}" != "$LINE_MINOR" ]]; then
            echo "::error::release version $RELEASE_VERSION does not belong to $RELEASE_LINE"
            exit 1
          fi
          if (( RELEASE_PATCH < SOURCE_PATCH )); then
            echo "::error::release version $RELEASE_VERSION precedes source version $SOURCE_VERSION"
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_LINE:refs/remotes/origin/$RELEASE_LINE"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor \
            "$SOURCE_COMMIT" "refs/remotes/origin/$RELEASE_LINE"; then
            echo "::error::$SOURCE_COMMIT is not part of $RELEASE_LINE"
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          UPSTREAM_WRAPPER_COMMIT="$(
            git merge-base "$SOURCE_COMMIT" refs/remotes/origin/main
          )"
          UPSTREAM_PACKAGE_NAME="$(
            git show "$UPSTREAM_WRAPPER_COMMIT:packages/pglite/package.json" |
              node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).name"
          )"
          UPSTREAM_PACKAGE_VERSION="$(
            git show "$UPSTREAM_WRAPPER_COMMIT:packages/pglite/package.json" |
              node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version"
          )"
          if [[ "$UPSTREAM_PACKAGE_NAME" != '@electric-sql/pglite' ]]; then
            echo "::error::unexpected upstream package: $UPSTREAM_PACKAGE_NAME"
            exit 1
          fi
          if [[ ! "$UPSTREAM_PACKAGE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::invalid upstream version: $UPSTREAM_PACKAGE_VERSION"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$LINE_MAJOR" || "${BASH_REMATCH[2]}" != "$LINE_MINOR" ]]; then
            echo "::error::upstream version $UPSTREAM_PACKAGE_VERSION does not belong to $RELEASE_LINE"
            exit 1
          fi

          UPSTREAM_ENGINE_PIN="$(
            git ls-tree "$UPSTREAM_WRAPPER_COMMIT" postgres-pglite |
              awk '{print $3}'
          )"
          WRAPPER_ENGINE_COMMIT="$(
            git ls-tree "$SOURCE_COMMIT" postgres-pglite |
              awk '{print $3}'
          )"
          ENGINE_COMMIT="$(git -C postgres-pglite rev-parse HEAD)"
          if [[ -z "$UPSTREAM_ENGINE_PIN" ]]; then
            echo "::error::upstream wrapper has no postgres-pglite gitlink"
            exit 1
          fi
          if [[ "$WRAPPER_ENGINE_COMMIT" != "$ENGINE_COMMIT" ]]; then
            echo "::error::checked-out engine does not match the wrapper gitlink"
            exit 1
          fi
          git -C postgres-pglite fetch --no-tags origin \
            "+refs/heads/$RELEASE_LINE:refs/remotes/origin/$RELEASE_LINE"
          if ! git -C postgres-pglite merge-base --is-ancestor \
            "$ENGINE_COMMIT" "refs/remotes/origin/$RELEASE_LINE"; then
            echo "::error::$ENGINE_COMMIT is not part of the engine $RELEASE_LINE"
            exit 1
          fi
          until git -C postgres-pglite merge-base --is-ancestor \
            "$UPSTREAM_ENGINE_PIN" "$ENGINE_COMMIT"
          do
            if [[ "$(
              git -C postgres-pglite rev-parse --is-shallow-repository
            )" != true ]]; then
              echo "::error::engine $ENGINE_COMMIT is not based on $UPSTREAM_ENGINE_PIN"
              exit 1
            fi
            git -C postgres-pglite fetch --no-tags --deepen=50 origin \
              "+refs/heads/$RELEASE_LINE:refs/remotes/origin/$RELEASE_LINE"
          done

          PG_VERSION="$(sed -n 's/^PG_VERSION=//p' "$BUILD_CONFIG_FILE")"
          SDK_VERSION="$(sed -n 's/^SDK_VERSION=//p' "$BUILD_CONFIG_FILE")"
          BUILDER_IMAGE="$(
            awk '$1 ~ /^electricsql\/pglite-builder:/ { print $1 }' \
              postgres-pglite/build-with-docker.sh
          )"
          if [[ -z "$PG_VERSION" || "$PG_VERSION" == *$'\n'* ||
                -z "$SDK_VERSION" || "$SDK_VERSION" == *$'\n'* ||
                -z "$BUILDER_IMAGE" || "$BUILDER_IMAGE" == *$'\n'* ]]
          then
            echo "::error::incomplete engine build identity"
            exit 1
          fi

          {
            echo "release_version=$RELEASE_VERSION"
            echo "upstream_package_name=$UPSTREAM_PACKAGE_NAME"
            echo "upstream_package_version=$UPSTREAM_PACKAGE_VERSION"
            echo "upstream_wrapper_commit=$UPSTREAM_WRAPPER_COMMIT"
            echo "source_commit=$SOURCE_COMMIT"
            echo "upstream_engine_pin=$UPSTREAM_ENGINE_PIN"
            echo "engine_commit=$ENGINE_COMMIT"
            echo "pg_version=$PG_VERSION"
            echo "sdk_version=$SDK_VERSION"
            echo "builder_image=$BUILDER_IMAGE"
          } >> "$GITHUB_OUTPUT"
      - name: Verify package licensing
        run: |
          if ! cmp -s LICENSE packages/pglite/LICENSE; then
            echo '::error::package Apache license differs from the wrapper license'
            exit 1
          fi
          if ! cmp -s postgres-pglite/COPYRIGHT packages/pglite/POSTGRES-LICENSE; then
            echo '::error::package PostgreSQL license differs from the engine license'
            exit 1
          fi
      - name: Verify release version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          VERSION_ERROR: ${{ runner.temp }}/pglite-versions.err
          VERSION_REPORT: ${{ runner.temp }}/pglite-versions.json
        run: |
          set -euo pipefail
          if npm view '@astermesh/pglite' versions --json \
            --registry='https://npm.pkg.github.com' \
            > "$VERSION_REPORT" 2> "$VERSION_ERROR"
          then
            :
          elif grep -q 'E404' "$VERSION_ERROR"; then
            printf '[]\n' > "$VERSION_REPORT"
          else
            cat "$VERSION_ERROR" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const report = JSON.parse(readFileSync(process.env.VERSION_REPORT, 'utf8'))
          const versions = Array.isArray(report) ? report : [report]
          const parse = (version) => {
            const match = /^([0-9]+)\.([0-9]+)\.([0-9]+)$/.exec(version)
            return match && match.slice(1).map(Number)
          }
          const release = parse(process.env.RELEASE_VERSION)
          const sameLine = versions
            .map((version) => [version, parse(version)])
            .filter(([, parsed]) =>
              parsed && parsed[0] === release[0] && parsed[1] === release[1],
            )
          if (sameLine.some(([version]) => version === process.env.RELEASE_VERSION)) {
            throw new Error(`package version already exists: ${process.env.RELEASE_VERSION}`)
          }
          const newestPatch = sameLine.reduce(
            (newest, [, parsed]) => Math.max(newest, parsed[2]),
            -1,
          )
          if (release[2] <= newestPatch) {
            throw new Error(
              `package version ${process.env.RELEASE_VERSION} is not newer than its release line`,
            )
          }
          NODE
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Set release version
        working-directory: packages/pglite
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          npm version "$RELEASE_VERSION" \
            --no-git-tag-version \
            --ignore-scripts \
            --allow-same-version
          npm pkg set repository.url='https://github.com/astermesh/pglite.git'
      - name: Build engine
        env:
          PGSRC: ${{ github.workspace }}/postgres-pglite
        run: pnpm wasm:build
      - name: Build package
        run: pnpm --filter "./packages/pglite..." build
      - name: Check package exports
        working-directory: packages/pglite
        run: pnpm check:exports
      - name: Write fork lineage predicate
        id: lineage
        env:
          BUILDER_IMAGE: ${{ steps.release.outputs.builder_image }}
          ENGINE_LINE_COMMIT: ${{ steps.release.outputs.engine_commit }}
          LINEAGE_PATH: ${{ runner.temp }}/pglite-fork-lineage.json
          PG_VERSION: ${{ steps.release.outputs.pg_version }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          SDK_VERSION: ${{ steps.release.outputs.sdk_version }}
          UPSTREAM_ENGINE_PIN: ${{ steps.release.outputs.upstream_engine_pin }}
          UPSTREAM_PACKAGE_NAME: ${{ steps.release.outputs.upstream_package_name }}
          UPSTREAM_PACKAGE_VERSION: ${{ steps.release.outputs.upstream_package_version }}
          UPSTREAM_WRAPPER_COMMIT: ${{ steps.release.outputs.upstream_wrapper_commit }}
          WRAPPER_LINE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          BUILDER_DIGEST="$(
            docker image inspect "$BUILDER_IMAGE" \
              --format '{{index .RepoDigests 0}}'
          )"
          if [[ ! "$BUILDER_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid builder digest: $BUILDER_DIGEST"
            exit 1
          fi
          export BUILDER_DIGEST
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'

          const required = (name, pattern) => {
            const value = process.env[name]
            if (!value || (pattern && !pattern.test(value))) {
              throw new Error(`invalid fork lineage value: ${name}`)
            }
            return value
          }
          const commit = /^[0-9a-f]{40}([0-9a-f]{24})?$/
          const version = /^[0-9]+\.[0-9]+\.[0-9]+$/
          const predicate = {
            schemaVersion: 1,
            releaseLine: required(
              'RELEASE_LINE',
              /^astermesh\/v[0-9]+\.[0-9]+$/,
            ),
            package: {
              name: '@astermesh/pglite',
              version: required('RELEASE_VERSION', version),
            },
            wrapper: {
              upstream: {
                repository: 'https://github.com/electric-sql/pglite',
                packageName: required('UPSTREAM_PACKAGE_NAME'),
                version: required('UPSTREAM_PACKAGE_VERSION', version),
                commit: required('UPSTREAM_WRAPPER_COMMIT', commit),
              },
              astermesh: {
                repository: 'https://github.com/astermesh/pglite',
                commit: required('WRAPPER_LINE_COMMIT', commit),
              },
            },
            engine: {
              upstream: {
                repository: 'https://github.com/electric-sql/postgres-pglite',
                commit: required('UPSTREAM_ENGINE_PIN', commit),
              },
              astermesh: {
                repository: 'https://github.com/astermesh/postgres-pglite',
                commit: required('ENGINE_LINE_COMMIT', commit),
              },
            },
            build: {
              postgresqlVersion: required('PG_VERSION'),
              emscriptenSdkVersion: required('SDK_VERSION'),
              builderImage: {
                reference: required('BUILDER_IMAGE'),
                digest: required(
                  'BUILDER_DIGEST',
                  /^[^@\s]+@sha256:[0-9a-f]{64}$/,
                ),
              },
            },
          }
          writeFileSync(
            process.env.LINEAGE_PATH,
            `${JSON.stringify(predicate, null, 2)}\n`,
          )
          NODE
          echo "predicate=$LINEAGE_PATH" >> "$GITHUB_OUTPUT"
      - name: Validate fork lineage predicate
        env:
          LINEAGE_PATH: ${{ steps.lineage.outputs.predicate }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npx --yes ajv-cli@5.0.0 validate \
            --spec=draft2020 \
            --strict=true \
            -s "$FORK_LINEAGE_SCHEMA" \
            -d "$LINEAGE_PATH"
      - name: Pack and verify publish payload
        id: package
        working-directory: packages/pglite
        env:
          PACK_REPORT: ${{ runner.temp }}/pglite-pack.json
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TARBALL_DIRECTORY: ${{ runner.temp }}/pglite-package
        run: |
          set -euo pipefail
          mkdir -p "$TARBALL_DIRECTORY"
          npm pack --json \
            --pack-destination "$TARBALL_DIRECTORY" \
            > "$PACK_REPORT"
          node --input-type=module <<'NODE'
          import {
            appendFileSync,
            readFileSync,
            realpathSync,
            statSync,
          } from 'node:fs'
          import { basename, resolve } from 'node:path'

          const [pack] = JSON.parse(readFileSync(process.env.PACK_REPORT, 'utf8'))
          const requiredPaths = [
            'LICENSE',
            'NOTICE',
            'POSTGRES-LICENSE',
            'dist/index.cjs',
            'dist/index.d.ts',
            'dist/index.js',
            'dist/pglite.data',
            'dist/pglite.js',
            'dist/pglite.wasm',
          ]
          if (pack.name !== '@astermesh/pglite') {
            throw new Error(`unexpected package name: ${pack.name}`)
          }
          if (pack.version !== process.env.RELEASE_VERSION) {
            throw new Error(`unexpected package version: ${pack.version}`)
          }
          for (const path of requiredPaths) {
            const file = pack.files.find((candidate) => candidate.path === path)
            if (!file || file.size <= 0) {
              throw new Error(`required package file is missing or empty: ${path}`)
            }
          }
          if (!pack.filename || basename(pack.filename) !== pack.filename) {
            throw new Error(`invalid package filename: ${pack.filename}`)
          }
          const tarball = realpathSync(
            resolve(process.env.TARBALL_DIRECTORY, pack.filename),
          )
          if (statSync(tarball).size <= 0) {
            throw new Error('package tarball is empty')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\n`)
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `filename=${pack.filename}\n`,
          )
          NODE
      - name: Attest package build provenance
        id: build-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.tarball }}
      - name: Attest package fork lineage
        id: lineage-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.tarball }}
          predicate-type: ${{ env.FORK_LINEAGE_PREDICATE_TYPE }}
          predicate-path: ${{ steps.lineage.outputs.predicate }}
      - name: Verify package attestations
        env:
          BUILD_BUNDLE: ${{ steps.build-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAGE_BUNDLE: ${{ steps.lineage-attestation.outputs.bundle-path }}
          LINEAGE_PATH: ${{ steps.lineage.outputs.predicate }}
          LINEAGE_VERIFICATION: ${{ runner.temp }}/pglite-lineage-verification.json
          SIGNER_WORKFLOW: astermesh/pglite/.github/workflows/build.yml
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          gh attestation verify "$TARBALL" \
            --bundle "$BUILD_BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type 'https://slsa.dev/provenance/v1'
          gh attestation verify "$TARBALL" \
            --bundle "$LINEAGE_BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type "$FORK_LINEAGE_PREDICATE_TYPE" \
            --format=json > "$LINEAGE_VERIFICATION"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const expected = JSON.parse(readFileSync(process.env.LINEAGE_PATH, 'utf8'))
          const results = JSON.parse(
            readFileSync(process.env.LINEAGE_VERIFICATION, 'utf8'),
          )
          assert.equal(results.length, 1, 'expected one fork-lineage attestation')
          assert.deepEqual(
            results[0].verificationResult.statement.predicate,
            expected,
            'signed fork-lineage predicate differs from the validated predicate',
          )
          NODE
      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pglite-release-${{ steps.release.outputs.release_version }}
          path: packages/pglite/release/**
          retention-days: 60
      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: pglite-dist-${{ steps.release.outputs.release_version }}
          path: packages/pglite/dist/**
          retention-days: 60
      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: pglite-package-${{ steps.release.outputs.release_version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 60
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --registry='https://npm.pkg.github.com'
