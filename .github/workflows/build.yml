name: build, verify, and publish package family
run-name: ${{ inputs.publish && 'publish' || 'verify' }} ${{ inputs.line || inputs.ref }} from ${{ inputs.ref }}

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "release line to verify or publish (astermesh/vX.Y)"
        required: true
        type: string
      promote_latest:
        description: "when publishing, also move the latest dist-tag"
        required: false
        default: false
        type: boolean
      publish:
        description: "attest, publish, and finalize the verified release"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "exact release-line commit to verify or publish"
        required: true
        type: string
      line:
        description: "release line containing the commit"
        required: true
        type: string
      promote_latest:
        description: "when publishing, also move the latest dist-tag"
        required: false
        default: false
        type: boolean
      publish:
        description: "attest, publish, and finalize the verified release"
        required: true
        type: boolean

concurrency:
  group: pglite-release-${{ inputs.line || inputs.ref }}
  cancel-in-progress: false

env:
  RELEASE_LINE: ${{ inputs.line || inputs.ref }}
  SOURCE_REF: ${{ inputs.ref }}
  STAGING_TAG: staging-${{ github.run_id }}
  TZ: UTC

jobs:
  resolve:
    name: Resolve release identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          submodules: recursive
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github
          path: .astermesh-ci
      - name: Resolve and validate release
        env:
          RELEASE_CONTEXT: ${{ runner.temp }}/release-context.json
        run: node .astermesh-ci/.github/scripts/resolve-release.mjs
      - name: Upload release identity
        uses: actions/upload-artifact@v4
        with:
          name: pglite-release-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/release-context.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and verify package family
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      count: ${{ steps.classify.outputs.count }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          submodules: recursive
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github
          path: .astermesh-ci
      - name: Download release identity
        uses: actions/download-artifact@v4
        with:
          name: pglite-release-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@astermesh"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify package licensing
        run: node .astermesh-ci/.github/scripts/verify-licenses.mjs
      - name: Check workspace package style
        run: pnpm -r --filter './packages/**' --if-present stylecheck
      - name: Build engine
        env:
          PGSRC: ${{ github.workspace }}/postgres-pglite
        run: pnpm wasm:build
      - name: Record native builder identity
        env:
          RELEASE_CONTEXT: ${{ runner.temp }}/release/release-context.json
        run: node .astermesh-ci/.github/scripts/record-builder-digest.mjs
      - name: Build all workspace packages
        run: pnpm ts:build
      - name: Typecheck workspace packages
        run: pnpm -r --filter './packages/**' --if-present typecheck
      - name: Test workspace packages
        run: pnpm -r --filter './packages/**' --if-present test
      - name: Check workspace package exports
        run: pnpm -r --filter './packages/**' --if-present check:exports
      - name: Pack and verify package family
        env:
          PACKED_PACKAGES: ${{ runner.temp }}/release/packed-packages.json
          RELEASE_CONTEXT: ${{ runner.temp }}/release/release-context.json
          TARBALL_DIRECTORY: ${{ runner.temp }}/release
        run: node .astermesh-ci/.github/scripts/pack-packages.mjs
      - name: Classify package versions
        id: classify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKED_PACKAGES: ${{ runner.temp }}/release/packed-packages.json
          PUBLISH_PACKAGES: ${{ runner.temp }}/release/publish-packages.json
          RELEASE_CONTEXT: ${{ runner.temp }}/release/release-context.json
        run: node .astermesh-ci/.github/scripts/classify-packages.mjs
      - name: Upload package family
        uses: actions/upload-artifact@v4
        with:
          name: pglite-package-family-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 60
      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pglite-engine-${{ github.run_id }}
          path: |
            packages/pglite/release/**
            packages/pglite-tools/release/**
          if-no-files-found: error
          retention-days: 60
      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: pglite-distributions-${{ github.run_id }}
          path: packages/pglite*/dist/**
          if-no-files-found: error
          retention-days: 60

  verify:
    name: Verify ${{ matrix.name }}@${{ matrix.version }}
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout attestation contract
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github
          path: .astermesh-ci
      - name: Download package family
        uses: actions/download-artifact@v4
        with:
          name: pglite-package-family-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@astermesh"
      - name: Write fork lineage predicate
        id: lineage
        env:
          LINEAGE_PATH: ${{ runner.temp }}/fork-lineage.json
          PACKAGE_NAME: ${{ matrix.name }}
          RELEASE_CONTEXT: ${{ runner.temp }}/release/release-context.json
        run: |
          node .astermesh-ci/.github/scripts/write-lineage.mjs
          echo "predicate=$LINEAGE_PATH" >> "$GITHUB_OUTPUT"
      - name: Validate fork lineage predicate
        env:
          LINEAGE_PATH: ${{ steps.lineage.outputs.predicate }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npx --yes ajv-cli@5.0.0 validate \
            --spec=draft2020 \
            --strict=true \
            -s .astermesh-ci/.github/attestations/fork-lineage-v1.schema.json \
            -d "$LINEAGE_PATH"
      - name: Upload verified fork lineage
        uses: actions/upload-artifact@v4
        with:
          name: pglite-fork-lineage-${{ matrix.filename }}
          path: ${{ steps.lineage.outputs.predicate }}
          if-no-files-found: error
          retention-days: 60
      - name: Dry-run package publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ runner.temp }}/release/${{ matrix.filename }}
        run: |
          npm publish "$TARBALL" \
            --dry-run \
            --ignore-scripts \
            --registry=https://npm.pkg.github.com

  publish:
    name: Attest and publish ${{ matrix.name }}@${{ matrix.version }}
    needs:
      - build
      - verify
    if: >-
      inputs.publish &&
      needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Download package family
        uses: actions/download-artifact@v4
        with:
          name: pglite-package-family-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Download verified fork lineage
        uses: actions/download-artifact@v4
        with:
          name: pglite-fork-lineage-${{ matrix.filename }}
          path: ${{ runner.temp }}/lineage
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@astermesh"
      - name: Attest package build provenance
        id: build-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release/${{ matrix.filename }}
      - name: Attest package fork lineage
        id: lineage-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release/${{ matrix.filename }}
          predicate-type: https://github.com/astermesh/pglite/attestations/fork-lineage/v1
          predicate-path: ${{ runner.temp }}/lineage/fork-lineage.json
      - name: Verify package attestations
        env:
          BUILD_BUNDLE: ${{ steps.build-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAGE_BUNDLE: ${{ steps.lineage-attestation.outputs.bundle-path }}
          LINEAGE_PATH: ${{ runner.temp }}/lineage/fork-lineage.json
          LINEAGE_VERIFICATION: ${{ runner.temp }}/lineage-verification.json
          TARBALL: ${{ runner.temp }}/release/${{ matrix.filename }}
        run: |
          gh attestation verify "$TARBALL" \
            --bundle "$BUILD_BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow astermesh/pglite/.github/workflows/build.yml \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "$TARBALL" \
            --bundle "$LINEAGE_BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow astermesh/pglite/.github/workflows/build.yml \
            --predicate-type \
              https://github.com/astermesh/pglite/attestations/fork-lineage/v1 \
            --format=json > "$LINEAGE_VERIFICATION"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const expected = JSON.parse(
            readFileSync(process.env.LINEAGE_PATH, 'utf8'),
          )
          const results = JSON.parse(
            readFileSync(process.env.LINEAGE_VERIFICATION, 'utf8'),
          )
          assert.equal(results.length, 1, 'expected one fork-lineage attestation')
          assert.deepEqual(
            results[0].verificationResult.statement.predicate,
            expected,
            'signed fork-lineage predicate differs from validated predicate',
          )
          NODE
      - name: Publish package to staging tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ runner.temp }}/release/${{ matrix.filename }}
        run: |
          npm publish "$TARBALL" \
            --tag "$STAGING_TAG" \
            --registry=https://npm.pkg.github.com

  finalize:
    name: Finalize package family release
    needs:
      - build
      - verify
      - publish
    if: >-
      always() &&
      inputs.publish &&
      needs.build.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github
          path: .astermesh-ci
      - name: Download package family
        uses: actions/download-artifact@v4
        with:
          name: pglite-package-family-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@astermesh"
      - name: Finalize release tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
          RELEASE_CONTEXT: ${{ runner.temp }}/release/release-context.json
          RELEASE_SUMMARY: ${{ runner.temp }}/release/release-summary.json
        run: node .astermesh-ci/.github/scripts/finalize-release.mjs
      - name: Upload release summary
        uses: actions/upload-artifact@v4
        with:
          name: pglite-release-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/release/release-summary.json
          if-no-files-found: error
          retention-days: 60
