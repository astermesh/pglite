name: publish the package family

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - "simbox/v*"
    paths:
      - "packages/*/package.json"

jobs:
  detect:
    name: Detect package version changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.versions.outputs.publish }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: simthis/pglite
          ref: simbox/ci
          sparse-checkout: .github
          path: .release-toolset
      - name: Detect version changes
        id: versions
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .release-toolset/.github/scripts/detect-version-change.mjs

  publish:
    name: Publish changed package versions
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    uses: simthis/pglite/.github/workflows/build.yml@simbox/ci
    with:
      ref: ${{ github.sha }}
      line: ${{ github.ref_name }}
      publish: true
