name: publish owned package

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

on:
  push:
    branches:
      - 'astermesh/v*'
    paths:
      - 'packages/pglite/package.json'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect package version change
        id: version
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid previous commit: $BEFORE_COMMIT"
            exit 1
          fi

          CURRENT_VERSION="$(
            node -p "require('./packages/pglite/package.json').version"
          )"
          if [[ "$BEFORE_COMMIT" == '0000000000000000000000000000000000000000' ]]; then
            PREVIOUS_VERSION="$CURRENT_VERSION"
          else
            PREVIOUS_VERSION="$(
              git show "${BEFORE_COMMIT}:packages/pglite/package.json" |
                node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version"
            )"
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ||
                ! "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
            echo "::error::package versions must be stable semver"
            exit 1
          fi
          if [[ "$CURRENT_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "previous=$PREVIOUS_VERSION"
            echo "current=$CURRENT_VERSION"
          } >> "$GITHUB_OUTPUT"
  publish:
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: astermesh/pglite/.github/workflows/build.yml@astermesh/ci
    with:
      ref: ${{ github.sha }}
      line: ${{ github.ref_name }}
